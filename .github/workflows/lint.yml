name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; fi
      - name: repo rules
        run: bash .github/scripts/repo-rules.sh
      # The same pinned kustomize as pin.yml installs.
      - name: Install kustomize
        run: |
          set -euo pipefail
          v=5.8.1
          sum=029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
          f="kustomize_v${v}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${v}/${f}"
          echo "${sum}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: tests
        run: bash .github/scripts/test.sh
