# The `pin` check: the caller's commit names its own image by content tag and
# digest, and that image exists. Call it from a job in the caller's
# .github/workflows, pinned by full commit SHA, after the image job and whatever
# its result (`needs: image`, `if: always()`), with `contents: read` and
# `packages: read`. The README has a complete caller job.
#
# The scripts run from this repo at the SHA the caller pinned, never from the
# caller's tree: the caller's checkout is data here. Rules: .github/scripts/
# pin-check.sh. The check is named `<caller job> / pin` in the caller's runs.
name: pin

on:
  workflow_call:
    inputs:
      inputs-file:
        description: Content-tag inputs file in the caller's repo, one path per line (keep it under .github/).
        type: string
        required: true
      image:
        description: Image name, e.g. ghcr.io/owner/app.
        type: string
        required: true
      pin-file:
        description: The kustomization whose images entry pins the image.
        type: string
        required: true
      render-dir:
        description: Directory to render for rule 3. Default, the pin file's directory.
        type: string
        default: ""
      drop-components:
        description: Render a copy without the kustomization's top-level components (ones CI cannot fetch). Only if they set no image.
        type: boolean
        default: false
      pin-fix:
        description: How to re-pin, shown in failures, e.g. "run `go run ./tools/pin pin` on the branch".
        type: string
        default: run the pin script on the branch
      release-checks-sha:
        description: Fallback only, when the job context lacks workflow_sha. The same SHA the caller calls this workflow at.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Which release-checks
        id: checks
        env:
          REPO: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
          FALLBACK: ${{ inputs.release-checks-sha }}
        run: |
          set -euo pipefail
          repo="${REPO:-greghaskins/release-checks}"
          sha="${SHA:-$FALLBACK}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot tell which release-checks commit this is: job.workflow_sha is '${SHA}', and the release-checks-sha input is '${FALLBACK}'. Set release-checks-sha to the SHA you call this workflow at."
            exit 1
          fi
          if [ -n "$SHA" ]; then from=job.workflow_sha; else from="the release-checks-sha input"; fi
          echo "release-checks: ${repo}@${sha} (from ${from})"
          {
            echo "fallback=$([ -n "$SHA" ] && echo false || echo true)"
            echo "repo=${repo}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
      # Two sibling checkouts: the caller's tree (data only) and this repo,
      # so neither lands inside the other.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.checks.outputs.repo }}
          ref: ${{ steps.checks.outputs.sha }}
          path: checks
          persist-credentials: false
          fetch-depth: 0
      # A SHA from the input, unlike job.workflow_sha, is only the caller's
      # word: it must be a commit on this repo's main.
      - name: Fallback SHA is on main
        if: steps.checks.outputs.fallback == 'true'
        working-directory: checks
        env:
          SHA: ${{ steps.checks.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::release-checks-sha ${SHA} is not on release-checks main"
            exit 1
          fi
      - name: Install kustomize
        run: |
          set -euo pipefail
          v=5.8.1
          case "$(uname -m)" in
            x86_64) arch=amd64; sum=029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d ;;
            aarch64) arch=arm64; sum=0953ea3e476f66d6ddfcd911d750f5167b9365aa9491b2326398e289fef2c142 ;;
            *) echo "unsupported runner arch $(uname -m)" >&2; exit 1 ;;
          esac
          f="kustomize_v${v}_linux_${arch}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${v}/${f}"
          echo "${sum}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Check the pin
        working-directory: caller
        env:
          INPUTS: ${{ inputs.inputs-file }}
          IMAGE: ${{ inputs.image }}
          PIN_FILE: ${{ inputs.pin-file }}
          RENDER_DIR: ${{ inputs.render-dir }}
          DROP_COMPONENTS: ${{ inputs.drop-components }}
          PIN_FIX: ${{ inputs.pin-fix }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DIR" ]; then unset RENDER_DIR; fi
          ../checks/.github/scripts/pin-check.sh
