# Shared secret scanning: the caller's working tree, every commit's content
# and message in the range, and the branch name, with gitleaks and the
# caller's private config. The caller passes the config as GITLEAKS_CONFIG_TOML
# (declared below); this repository stores none. Output never includes matched
# text. Callers run it on pull_request, merge_group and push to main.
name: secret-scan

on:
  workflow_call:
    secrets:
      GITLEAKS_CONFIG_TOML:
        description: The caller's private gitleaks config
        required: true

permissions: {}

jobs:
  secret-scan:
    # Fork pull requests get no config, so the job is skipped there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Which release-checks
        id: checks
        env:
          RC_REPO: ${{ job.workflow_repository }}
          RC_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$RC_REPO" ] || ! [[ "$RC_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot tell which release-checks commit this is"; exit 1
          fi
          { echo "repo=${RC_REPO}"; echo "sha=${RC_SHA}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.checks.outputs.repo }}
          ref: ${{ steps.checks.outputs.sha }}
          path: checks
          persist-credentials: false
      - run: checks/.github/scripts/secret-scan/install.sh
      - name: Scan
        working-directory: caller
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          s=../checks/.github/scripts/secret-scan
          "$s/require-config.sh"
          "$s/tree.sh"
          "$s/range.sh" "$BASE" "$HEAD"
          printf '%s' "$HEAD_REF" | "$s/text.sh" "branch name"
